name: Copy Production Data to Preview

on:
    workflow_dispatch:
        inputs:
            confirmation:
                description: Type OVERWRITE PREVIEW to replace all preview D1 data with production data
                required: true
                type: string

permissions:
    contents: read

jobs:
    copy:
        if: github.ref == 'refs/heads/main' && inputs.confirmation == 'OVERWRITE PREVIEW'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: preview
        concurrency:
            group: princess-copy-production-to-preview
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify D1 resource IDs are configured
              run: |
                  if grep -Eq 'REPLACE_WITH_(PRODUCTION|PREVIEW)_' wrangler.jsonc; then
                      echo '::error file=wrangler.jsonc::Replace all REPLACE_WITH_ D1 ID placeholders before copying data.'
                      exit 1
                  fi

            - name: Copy production data to preview
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
                  CLOUDFLARE_PREVIEW_DATABASE_ID: ${{ vars.CLOUDFLARE_PREVIEW_DATABASE_ID }}
              run: pnpm run db:copy:production-to-preview --confirm-overwrite-preview
