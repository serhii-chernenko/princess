name: Deploy Princess Worker

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare stable runtime secrets file
              run: |
                  cat <<'EOF' > .dev.vars.production
                  BOT_TOKEN=${{ secrets.BOT_TOKEN }}
                  ADMIN_ID=${{ vars.ADMIN_ID }}
                  TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
                  TELEGRAM_WEBHOOK_PATH=${{ vars.TELEGRAM_WEBHOOK_PATH }}
                  WORKER_BASE_URL=${{ vars.WORKER_BASE_URL }}
                  EOF

            - name: Deploy production Worker
              run: pnpm run deploy:production
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
                  CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
                  TELEGRAM_WEBHOOK_PATH: ${{ vars.TELEGRAM_WEBHOOK_PATH }}
                  WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
