name: Validate Princess Worker

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run canonical checks
              run: pnpm run check

            - name: Regenerate committed artifacts and reject drift
              run: |
                  pnpm run i18n:generate
                  pnpm run releases:sync
                  pnpm run cf-typegen
                  pnpm run db:generate

                  generated_status="$(git status --short --untracked-files=all -- drizzle releases.generated.json src/i18n worker-configuration.d.ts)"
                  if [[ -n "$generated_status" ]]; then
                      echo '::error::Committed generated artifacts are out of date.'
                      printf '%s\n' "$generated_status"
                      exit 1
                  fi

            - name: Dry-run production Worker deployment
              run: pnpm exec wrangler deploy --env production --dry-run
