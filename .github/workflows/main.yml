name: Validate and Manually Deploy Stable Princess Worker

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run canonical checks
              run: pnpm run check

            - name: Regenerate committed artifacts and reject drift
              run: |
                  pnpm run i18n:generate
                  pnpm run releases:sync
                  pnpm run cf-typegen
                  pnpm run db:generate

                  generated_status="$(git status --short --untracked-files=all -- drizzle releases.generated.json src/i18n worker-configuration.d.ts)"
                  if [[ -n "$generated_status" ]]; then
                      echo '::error::Committed generated artifacts are out of date.'
                      printf '%s\n' "$generated_status"
                      exit 1
                  fi

            - name: Dry-run production Worker deployment
              run: pnpm exec wrangler deploy --env production --dry-run

            - name: Dry-run beta Worker deployment
              run: pnpm exec wrangler deploy --env beta --dry-run

    deploy:
        needs: validate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: princess-stable-deploy
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify production resource IDs are configured
              run: |
                  if grep -Eq 'REPLACE_WITH_PRODUCTION_' wrangler.jsonc; then
                      echo '::error file=wrangler.jsonc::Replace all REPLACE_WITH_PRODUCTION_ resource ID placeholders before deploying stable.'
                      exit 1
                  fi

            - name: Deploy stable Worker only
              env:
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
                  TELEGRAM_WEBHOOK_PATH: ${{ secrets.TELEGRAM_WEBHOOK_PATH }}
                  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
              run: |
                  set -euo pipefail
                  runtime_secrets_file='.dev.vars.production'
                  cleanup_runtime_secrets() {
                      rm -f -- "$runtime_secrets_file"
                  }
                  trap cleanup_runtime_secrets EXIT

                  pnpm exec tsx scripts/cloudflare/write-runtime-secrets.ts "$runtime_secrets_file"
                  unset BOT_TOKEN TELEGRAM_WEBHOOK_PATH TELEGRAM_WEBHOOK_SECRET
                  pnpm run worker:deploy:stable
